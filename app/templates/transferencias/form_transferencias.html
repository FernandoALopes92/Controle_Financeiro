<div class="modal fade" id="modalTransferencia" tabindex="-1" aria-labelledby="modalTransferenciaLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      
      <form id="formTransferencia" method="POST" action="{{ url_for('transferencias.nova_transferencia') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="modal-header bg-purple text-white border-0">
          <h5 class="modal-title fw-bold" id="modalTransferenciaLabel">
            <i class="bi bi-arrow-left-right me-2"></i>Nova Transferência
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        
        <div class="modal-body p-4 bg-light">
          
          <div class="row g-3">
            
            <div class="col-md-6">
              <label for="conta_origem" class="form-label text-muted fw-semibold small text-uppercase">Conta de Origem</label>
              <select id="conta_origem" class="form-select shadow-sm border-danger" name="conta_origem" required>
                <option value="" disabled selected>Selecione...</option>
                {% for conta in contas %}
                  <option value="{{ conta.id }}" data-saldo="{{ conta.saldo_atual }}">
                    {{ conta.nome }}
                  </option>
                {% endfor %}
              </select>
              <div id="saldoContaOrigemContainer" class="mt-1 text-end" style="display: none;">
                <span id="saldoContaOrigem" class="badge bg-secondary fw-medium"></span>
              </div>
            </div>

            <div class="col-md-6">
              <label for="conta_destino" class="form-label text-muted fw-semibold small text-uppercase">Conta de Destino</label>
              <select class="form-select shadow-sm border-success" name="conta_destino" id="conta_destino" required>
                <option value="" disabled selected>Selecione...</option>
                {% for conta in contas %}
                  <option value="{{ conta.id }}" data-saldo="{{ conta.saldo_atual }}">
                    {{ conta.nome }}
                  </option>
                {% endfor %}
              </select>
              <div id="saldoContaDestinoContainer" class="mt-1 text-end" style="display: none;">
                <span id="saldoContaDestino" class="badge bg-secondary fw-medium"></span>
              </div>
            </div>

            <div class="col-md-6">
              <label for="valor" class="form-label text-muted fw-semibold small text-uppercase">Valor (R$)</label>
              <input type="number" step="0.01" name="valor" id="valor" class="form-control shadow-sm fw-bold" placeholder="0,00" required />
            </div>

            <div class="col-md-6">
              <label for="dataTransferencia" class="form-label text-muted fw-semibold small text-uppercase">Data</label>
              <input type="date" id="dataTransferencia" name="data" class="form-control shadow-sm" value="{{ data }}" required />
            </div>

            <div class="col-12">
              <label for="descricao" class="form-label text-muted fw-semibold small text-uppercase">Observações</label>
              <input type="text" name="descricao" id="descricao" class="form-control shadow-sm" placeholder="Ex: Pagamento de empréstimo, reserva..." />
            </div>

          </div>
        </div>
        
        <div class="modal-footer border-top-0 bg-white">
          <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-purple px-5 shadow-sm fw-bold">Transferir</button>
        </div>
        
      </form>
    </div>
  </div>
</div>
