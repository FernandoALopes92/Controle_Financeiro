<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{% block title %}Gestão Financeira{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
<!--     <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}"
    /> -->

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
  </head>
  <body>
    <!-- prettier-ignore -->
    <div
      id="flash-messages"
      data-messages='{{ get_flashed_messages(with_categories=true) | tojson | safe }}'
      style="display: none;"
    ></div>

    <!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm">
      <div class="container-fluid">
        
        <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="{{ url_for('main.dashboard') }}">
          <i class="bi bi-wallet2 me-2"></i> Gestão Financeira
        </a>
        
        <button
          class="navbar-toggler text-white border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list fs-1"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 mt-2 mt-lg-0">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle fw-semibold text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-sliders me-1"></i> Controle
              </a>
              <ul class="dropdown-menu shadow border-0" style="border-radius: 8px;">
                <li><a class="dropdown-item py-2" href="{{ url_for('categorias.listar') }}"><i class="bi bi-tags me-2 text-purple" style="color: #6a0dad;"></i> Categorias</a></li>
                <li><a class="dropdown-item py-2" href="{{ url_for('meios_pagamento.listar') }}"><i class="bi bi-credit-card me-2 text-purple" style="color: #6a0dad;"></i> Cartões de Crédito</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item py-2" href="{{ url_for('contas.listar') }}"><i class="bi bi-bank me-2 text-purple" style="color: #6a0dad;"></i> Contas</a></li>
              </ul>
            </li>
                        
            <li class="nav-item">
              <a class="nav-link fw-semibold text-white" href="{{ url_for('relatorios.relatorios') }}"><i class="bi bi-bar-chart-line me-1"></i> Relatórios</a>
            </li>
            
            <li class="nav-item">
              <a class="nav-link fw-semibold text-white" href="{{ url_for('movimentacoes.lista') }}">Mov. Contas</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold text-white" href="{{ url_for('cartao.listar_movimentacoes_cartao')}}">Mov. Cartões</a>
            </li>
          </ul>

          {% if current_user.is_authenticated %}
          <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0 pb-3 pb-lg-0 border-top-lg-0 border-light pt-3 pt-lg-0 border-top-lg-0">
              <span class="text-white small fw-semibold opacity-75">
                  <i class="bi bi-person-circle me-1"></i> {{ current_user.nome }}
              </span>
              <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-light fw-bold px-4" style="border-radius: 20px;" title="Sair do sistema">
                  Sair
              </a>
          </div>
          {% endif %}

        </div>
      </div>
    </nav>

    <!-- Conteúdo da página -->
    <!-- Mensagens -->
    <div class="container-fluid">{% block content %}{% endblock %}</div>

    <!-- Toast -->
    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      style="z-index: 9999"
    >
      <div
        id="liveToast"
        class="toast align-items-center text-bg-primary border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">Mensagem aqui</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <!-- Scripts -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/imask"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
