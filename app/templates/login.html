<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Gestão Financeira</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/feedback.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}" />
</head>
<body class="auth-page">
  <div class="auth-pattern" aria-hidden="true">
    <i class="bi bi-wallet2"></i><i class="bi bi-piggy-bank-fill"></i><i class="bi bi-currency-dollar"></i><i class="bi bi-graph-up-arrow"></i><i class="bi bi-wallet2"></i><i class="bi bi-piggy-bank-fill"></i>
  </div>

  <main class="auth-card" aria-labelledby="login-title">
    <div class="text-center">
      <div class="auth-brand"><i class="bi bi-wallet2" aria-hidden="true"></i></div>
      <h1 id="login-title">Bem-vindo(a)</h1>
      <p class="auth-card__subtitle">Acesse sua gestão financeira com segurança.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required autofocus autocomplete="email" />
      </div>
      <div class="mb-4">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
