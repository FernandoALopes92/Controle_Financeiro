<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Gestão Financeira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <style>

        body {
            /* Fundo degradê roxo */
            background: linear-gradient(135deg, #4a00e0 0%, #8e2de2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden; /* Evita barras de rolagem pelos ícones */
        }

        /* Camada de ícones flutuantes */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 100px;
            padding: 50px;
            opacity: 0.07; /* Bem sutil para não atrapalhar a leitura */
            pointer-events: none; /* O mouse passa direto por eles */
            z-index: 0;
        }

        .bg-pattern i {
        font-size: 80px;
        color: white;
        /* Cada ícone terá um atraso de animação diferente para não ficarem sincronizados */
        }
      
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1; /* Card fica acima dos ícones */
        }
        
        .btn-purple {
            background-color: #6a0dad;
            color: white;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn-purple:hover {
            background-color: #5a00c2;
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
        }

    </style>
</head>
<body>
    <!-- Padrão de fundo financeiro -->
    <div class="bg-pattern">
        <i class="bi bi-wallet2"></i>
        <i class="bi bi-piggy-bank-fill"></i>
        <i class="bi bi-currency-dollar"></i>
        <i class="bi bi-graph-up-arrow"></i>
        <i class="bi bi-wallet2"></i>
        <i class="bi bi-piggy-bank-fill"></i>
        <i class="bi bi-currency-dollar"></i>
        <i class="bi bi-graph-up-arrow"></i>
        <i class="bi bi-wallet2"></i>
        <i class="bi bi-piggy-bank-fill"></i>
    </div>

    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-wallet2" style="font-size: 3rem; color: #6a0dad;"></i>
            <h4 class="fw-bold mt-2">Bem-vindo(a)</h4>
            <p class="text-muted">Acesse sua gestão financeira</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %} 
            {% if messages %} 
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} rounded-3 shadow-sm border-0">{{ message }}</div>
                {% endfor %} 
            {% endif %} 
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required autofocus />
            </div>
            <div class="mb-4">
                <label for="senha" class="form-label fw-semibold">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required />
            </div>
            <button type="submit" class="btn btn-purple w-100 shadow-sm">Entrar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
